<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Listing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      color: #333;
    }
    label {
      margin-right: 10px;
    }
    select {
      padding: 5px;
      margin-bottom: 20px;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      background: #f9f9f9;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ddd;
    }
    li strong {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Product Listing</h1>
  
  <div>
    <label for="categoryFilter">Filter by Category: </label>
    <select id="categoryFilter">
      <option value="All">All</option>
      <option value="Stationery">Stationery</option>
      <option value="Bags">Bags</option>
      <option value="Electronics">Electronics</option>
    </select>
  </div>

  <div>
    <h2>Products:</h2>
    <ul id="productList">
      
    </ul>
  </div>

  <script>
    
    const products = [
      { name: "Notebook", price: 5.99, category: "Stationery" },
      { name: "Laptop", price: 799.99, category: "Electronics" },
      { name: "Backpack", price: 30.00, category: "Bags" },
      { name: "Pen", price: 1.50, category: "Stationery" },
      { name: "Smartphone", price: 599.99, category: "Electronics" },
      { name: "Duffel Bag", price: 45.00, category: "Bags" },
      { name: "Desk Organizer", price: 12.99, category: "Stationery" },
    ];

    
    function renderProducts(filteredProducts) {
      const productList = document.getElementById('productList');
      productList.innerHTML = ''; 

      filteredProducts.forEach(product => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${product.name}</strong> - $${product.price.toFixed(2)} - ${product.category}`;
        productList.appendChild(li);
      });
    }

    
    function filterProducts() {
      const selectedCategory = document.getElementById('categoryFilter').value;

      let filteredProducts = products;
      if (selectedCategory !== 'All') {
        filteredProducts = products.filter(product => product.category === selectedCategory);
      }

      renderProducts(filteredProducts);
    }

    
    document.getElementById('categoryFilter').addEventListener('change', filterProducts);

    
    renderProducts(products);
  </script>

</body>
</html>
